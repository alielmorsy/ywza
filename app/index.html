<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ywza</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d1d19; }
      #splash {
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(60% 50% at 50% 46%, #23231f, #1d1d19 70%, #191915);
        color: #eeeeea; font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        cursor: default; user-select: none;
        transition: opacity 0.5s var(--ease);
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .mark { display: grid; justify-items: center; pointer-events: none; transition: transform 0.5s var(--ease), filter 0.5s var(--ease); }
      #splash.gone .mark { transform: translateY(-6px) scale(1.02); filter: blur(4px); }

      #splash .word { display: flex; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; padding-bottom: 0.08em; overflow: hidden; }
      #splash .word span { display: inline-block; transform: translateY(105%); animation: rise 0.9s var(--ease) forwards; }
      #splash .word span:nth-child(2) { animation-delay: 0.06s; }
      #splash .word span:nth-child(3) { animation-delay: 0.12s; }
      #splash .word span:nth-child(4) { animation-delay: 0.18s; }

      #splash .bar { position: relative; width: 96px; height: 2px; margin-top: 22px; overflow: hidden; border-radius: 2px; background: #2c2c27; opacity: 0; animation: fade 0.6s var(--ease) 0.35s forwards; }
      #splash .bar::after {
        content: ""; position: absolute; inset: 0; width: 45%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #87849a 40%, #c0c1b2 60%, transparent);
        transform: translateX(-100%);
        animation: sweep 1.3s cubic-bezier(0.65, 0, 0.35, 1) 0.4s infinite;
      }
      #splash .note { margin-top: 14px; font: 400 12px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #9b9b97; opacity: 0; animation: fade 0.6s var(--ease) 0.5s forwards; }

      @keyframes rise { to { transform: none; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes sweep { to { transform: translateX(225%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .word span, #splash .bar, #splash .note { animation: none; transform: none; opacity: 1; }
        #splash .bar::after { animation-duration: 2.6s; }
        #splash.gone .mark { transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Starting ywza" data-tauri-drag-region>
      <div class="mark">
        <div class="word" aria-hidden="true"><span>y</span><span>w</span><span>z</span><span>a</span></div>
        <div class="bar"></div>
        <div class="note">Connecting to the service</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
