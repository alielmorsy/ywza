[workspace]
resolver = "2"
members = [
    "crates/ywza-proto",
    "crates/ywza-desktop",
    "crates/ywza-ocr",
    "crates/ywza-term",
    "crates/ywza-stream",
    "crates/ywza-agent",
    "crates/ywza-cli",
    "crates/ywza-relay",
    "app/src-tauri",
]
# Plain `cargo build`/`test` at the root skips the desktop app; build it with `yarn tauri build` or `-p ywza-app`.
default-members = [
    "crates/ywza-proto",
    "crates/ywza-desktop",
    "crates/ywza-ocr",
    "crates/ywza-term",
    "crates/ywza-stream",
    "crates/ywza-agent",
    "crates/ywza-cli",
    "crates/ywza-relay",
]

# Thin LTO keeps desktop release builds parallel; `yarn android:build` switches to fat LTO
# with one codegen unit for the smallest APK.
[profile.release]
lto = "thin"
strip = true

# Dependencies carry no debug info in dev builds; it made the debug APK ~350 MB.
[profile.dev.package."*"]
debug = false

[workspace.package]
# The one version: every crate, the desktop app and its installer.
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
