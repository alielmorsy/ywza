name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # beforeBundleCommand also builds ywza-agent and the CLI into the installer.
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: ywza-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/ywza-agent.exe
            target/release/ywza.exe
            target/release/ywza-relay.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: cargo build --release
      - run: yarn tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: ywza-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/ywza-agent
            target/release/ywza
            target/release/ywza-relay

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn android:build --apk --target aarch64
      # Signed only when the release keystore secrets are set; otherwise the unsigned APK is uploaded.
      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          mkdir -p out
          if [ -z "$KEYSTORE" ]; then cp "$apk" out/ywza-unsigned.apk; exit 0; fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE" | base64 -d > release.jks
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out out/ywza.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: ywza-android
          path: out/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # Bare binaries share names across platforms, so each set ships as one archive.
      - run: |
          cd dist
          zip -j ywza-windows-bins.zip ywza-windows/*.exe
          chmod +x ywza-linux/ywza-agent ywza-linux/ywza ywza-linux/ywza-relay
          tar -czf ywza-linux-x86_64.tar.gz -C ywza-linux ywza-agent ywza ywza-relay
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ywza-windows/bundle/nsis/*.exe
            dist/ywza-windows-bins.zip
            dist/ywza-linux/bundle/deb/*.deb
            dist/ywza-linux-x86_64.tar.gz
            dist/ywza-android/*.apk
