[project]
name = "ywza-mcp"
version = "0.1.0"
description = "MCP server and Python client for ywza agents"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ywza-mcp = "ywza_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ywza_mcp"]
